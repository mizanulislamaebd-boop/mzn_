<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Keyboard Tester</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

    <!-- MAIN KEYBOARD -->
    <div class="keyboard">

        <!-- TOP -->
        <div class="row top-row">

            <div class="key small" data-key="Escape">Esc</div>

            <div class="gap"></div>

            <div class="key small" data-key="F1">F1</div>
            <div class="key small" data-key="F2">F2</div>
            <div class="key small" data-key="F3">F3</div>
            <div class="key small" data-key="F4">F4</div>

            <div class="gap"></div>

            <div class="key small" data-key="F5">F5</div>
            <div class="key small" data-key="F6">F6</div>
            <div class="key small" data-key="F7">F7</div>
            <div class="key small" data-key="F8">F8</div>

            <div class="gap"></div>

            <div class="key small" data-key="F9">F9</div>
            <div class="key small" data-key="F10">F10</div>
            <div class="key small" data-key="F11">F11</div>
            <div class="key small" data-key="F12">F12</div>

            <div class="gap"></div>

            <div class="key small" data-key="Insert">Ins</div>
            <div class="key small" data-key="Delete">Del</div>

        </div>

        <!-- NUMBER -->
        <div class="row">

            <div class="key" data-key="Backquote">`</div>

            <div class="key" data-key="Digit1">1</div>
            <div class="key" data-key="Digit2">2</div>
            <div class="key" data-key="Digit3">3</div>
            <div class="key" data-key="Digit4">4</div>
            <div class="key" data-key="Digit5">5</div>
            <div class="key" data-key="Digit6">6</div>
            <div class="key" data-key="Digit7">7</div>
            <div class="key" data-key="Digit8">8</div>
            <div class="key" data-key="Digit9">9</div>
            <div class="key" data-key="Digit0">0</div>

            <div class="key" data-key="Minus">-</div>
            <div class="key" data-key="Equal">=</div>

            <div class="key backspace" data-key="Backspace">
                Backspace
            </div>

        </div>

        <!-- TAB -->
        <div class="row">

            <div class="key tab" data-key="Tab">Tab</div>

            <div class="key" data-key="KeyQ">Q</div>
            <div class="key" data-key="KeyW">W</div>
            <div class="key" data-key="KeyE">E</div>
            <div class="key" data-key="KeyR">R</div>
            <div class="key" data-key="KeyT">T</div>
            <div class="key" data-key="KeyY">Y</div>
            <div class="key" data-key="KeyU">U</div>
            <div class="key" data-key="KeyI">I</div>
            <div class="key" data-key="KeyO">O</div>
            <div class="key" data-key="KeyP">P</div>

            <div class="key" data-key="BracketLeft">[</div>
            <div class="key" data-key="BracketRight">]</div>

            <div class="key slash" data-key="Backslash">\</div>

        </div>

        <!-- CAPS -->
        <div class="row">

            <div class="key caps" data-key="CapsLock">Caps</div>

            <div class="key" data-key="KeyA">A</div>
            <div class="key" data-key="KeyS">S</div>
            <div class="key" data-key="KeyD">D</div>
            <div class="key" data-key="KeyF">F</div>
            <div class="key" data-key="KeyG">G</div>
            <div class="key" data-key="KeyH">H</div>
            <div class="key" data-key="KeyJ">J</div>
            <div class="key" data-key="KeyK">K</div>
            <div class="key" data-key="KeyL">L</div>

            <div class="key" data-key="Semicolon">;</div>
            <div class="key" data-key="Quote">'</div>

            <div class="key enter" data-key="Enter">Enter</div>

        </div>

        <!-- SHIFT -->
        <div class="row">

            <div class="key shift-left" data-key="ShiftLeft">Shift</div>

            <div class="key" data-key="KeyZ">Z</div>
            <div class="key" data-key="KeyX">X</div>
            <div class="key" data-key="KeyC">C</div>
            <div class="key" data-key="KeyV">V</div>
            <div class="key" data-key="KeyB">B</div>
            <div class="key" data-key="KeyN">N</div>
            <div class="key" data-key="KeyM">M</div>

            <div class="key" data-key="Comma">,</div>
            <div class="key" data-key="Period">.</div>
            <div class="key" data-key="Slash">/</div>

            <div class="key shift-right" data-key="ShiftRight">Shift</div>

        </div>

        <!-- BOTTOM -->
        <div class="row">

            <div class="key ctrl" data-key="ControlLeft">Ctrl</div>

            <div class="key fn" id="fnKey">Fn</div>

            <div class="key win" data-key="MetaLeft">Win</div>

            <div class="key alt" data-key="AltLeft">Alt</div>

            <div class="key space" data-key="Space">Space</div>

            <div class="key alt" data-key="AltRight">Alt</div>

            <div class="key ctrl" data-key="ControlRight">Ctrl</div>

        </div>

    </div>

    <!-- NUMPAD -->
    <div class="numpad">

        <div class="num-row">

            <div class="key small-key" data-key="NumLock">Num</div>
            <div class="key small-key" data-key="NumpadDivide">/</div>
            <div class="key small-key" data-key="NumpadMultiply">*</div>
            <div class="key small-key" data-key="NumpadSubtract">-</div>

        </div>

        <div class="num-row">

            <div class="key small-key" data-key="Numpad7">7</div>
            <div class="key small-key" data-key="Numpad8">8</div>
            <div class="key small-key" data-key="Numpad9">9</div>

            <div class="key tall-key" data-key="NumpadAdd">+</div>

        </div>

        <div class="num-row">

            <div class="key small-key" data-key="Numpad4">4</div>
            <div class="key small-key" data-key="Numpad5">5</div>
            <div class="key small-key" data-key="Numpad6">6</div>

        </div>

        <div class="num-row">

            <div class="key small-key" data-key="Numpad1">1</div>
            <div class="key small-key" data-key="Numpad2">2</div>
            <div class="key small-key" data-key="Numpad3">3</div>

            <div class="key tall-key" data-key="NumpadEnter">Enter</div>

        </div>

        <div class="num-row">

            <div class="key zero-key" data-key="Numpad0">0</div>

            <div class="key small-key" data-key="NumpadDecimal">.</div>

        </div>

    </div>

</div>

<!-- MOUSE TEST -->
<div class="mouse-test">

    <div class="mouse-btn" id="leftMouse">
        Left Click
    </div>

    <div class="mouse-btn" id="rightMouse">
        Right Click
    </div>

</div>

<!-- RESET -->
<button id="resetBtn">
    Reset Tester
</button>

<script src="script.js"></script>

</body>
</html>
